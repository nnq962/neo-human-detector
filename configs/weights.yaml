# - `path` là đường dẫn tương đối bên trong thư mục weights/.
# - `drive_id` để null cho đến khi model đã được tải lên Google Drive.
# - `sha256` dùng để kiểm tra file sau khi tải.
# - PyTorch hỗ trợ batch động; mỗi file RKNN chỉ hỗ trợ đúng batch đã export.
# - `runtime_supported: false` nghĩa là đã khai báo model nhưng runtime hiện tại
#   chưa có detector tương ứng, vì vậy giao diện không nên cho phép lựa chọn.

