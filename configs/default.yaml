detection:
  task: detect
  model_size: medium
  batch_size: 2
  conf: 0.47
  verbose: false
zone_state_machine:
  confirm_enter_time: 6.0
  confirm_exit_time: 6.0
  pending_enter_miss_grace_time: 1.5
reid:
  enabled: true
  zone_only: true
  require_occupied_zone: true
  model_path: weights/reid/osnet_ain_ms_d_c.pth.tar
  device: auto
  embedding:
    batch_size: 1
  track:
    buffer_min: 1
    grace_period: 0
    update_interval: 1
    max_buffer_size: 1
    gallery_cleanup_interval: 1
    max_reverify_misses: 0
  quality:
    overlap_iou_threshold: 1.0
    overlap_ioa_threshold: 1.0
    stable_bbox_window: 1
    stable_center_shift_ratio: 0.0
    stable_size_change_ratio: 0.0
    laplacian_var_threshold: 0.0
  gallery:
    sim_threshold_match: 1.0
    ema_alpha: 1.0
    max_samples: 1
    ttl_minutes: 0.0
uart:
  port: /dev/ttyS0
  baudrate: 600
cameras:
- name: AI Center
  stream:
    source: rtsp://admin:061223%40bC@192.168.0.10:554/Streaming/Channels/101
    protocol: tcp
    on_demand: true
  enabled: true
  zones: []
  id: gcphg
- name: Android Center
  stream:
    source: rtsp://admin:061223%40bC@192.168.0.15:554/Streaming/Channels/101
    protocol: tcp
    on_demand: true
  enabled: true
  zones: []
  id: rtdll
