auto_start: true
detection:
  task: pose
  model_size: medium
  batch_size: 2
  conf: 0.5
  verbose: false
zone_state_machine:
  confirm_enter_time: 6.0
  confirm_exit_time: 6.0
  pending_enter_miss_grace_time: 1.5
reid:
  enabled: true
  zone_only: true
  require_occupied_zone: true
  model_path: weights/reid/osnet_ain_ms_d_c.pth.tar
  device: auto
  embedding:
    batch_size: 1
  track:
    buffer_min: 70
    grace_period: 90
    update_interval: 100
    max_buffer_size: 1
    gallery_cleanup_interval: 1800
    max_reverify_misses: 10
  quality:
    overlap_iou_threshold: 0.25
    overlap_ioa_threshold: 0.45
    stable_bbox_window: 30
    stable_center_shift_ratio: 0.2
    stable_size_change_ratio: 0.25
    laplacian_var_threshold: 50.0
  gallery:
    sim_threshold_match: 0.7
    ema_alpha: 0.75
    max_samples: 5
    ttl_minutes: 10.0
robot_dispatch:
  enabled: true
  emit_occupied: true
  emit_cleared: true
  raise_on_transport_error: false
  require_reid: true
  fallback_without_reid: false
  service_ttl_minutes: 30
uart:
  port: /dev/ttyUSB1
  baudrate: 115200
