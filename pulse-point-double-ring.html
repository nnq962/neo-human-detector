<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse Point — Double Ring</title>
<style>
  :root{
    --accent:#38d9ff;
    --selected:#ffb545;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    background:#0e1318;
    color:#eef4f7;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display:grid;
    place-items:center;
    padding:24px;
  }

  /* container that wraps your image — must be position:relative */
  .frame{
    position:relative;
    width:min(720px, 100%);
    aspect-ratio:4/3;
    border-radius:12px;
    overflow:hidden;
    background:
      radial-gradient(circle at 30% 20%, rgba(56,217,255,.10), transparent 55%),
      #10161c;
  }
  .frame img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  /* the pulse point itself — positioned via inline style left/top */
  .pulse-point{
    position:absolute;
    width:0; height:0;
    z-index:2;
    cursor:pointer;
    transition: opacity .25s ease;
  }
  .pulse-point .dot{
    position:absolute;
    top:0; left:0;
    width:8px; height:8px;
    margin:-4px 0 0 -4px;
    border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 8px rgba(56,217,255,.9);
    transition: background .2s ease, box-shadow .2s ease, width .2s ease, height .2s ease, margin .2s ease;
  }
  .pulse-point .ring{
    position:absolute;
    top:0; left:0;
    width:8px; height:8px;
    border-radius:50%;
    border:2px solid var(--accent);
    transform:translate(-50%,-50%);
    animation: pp-expand 2s cubic-bezier(.25,.6,.4,1) infinite;
  }
  .pulse-point .ring.r2{
    animation-delay:1s;
  }
  @keyframes pp-expand{
    0%{   width:8px;  height:8px;  opacity:.8; border-width:2px; }
    100%{ width:54px; height:54px; opacity:0;  border-width:.5px; }
  }

  /* other points step back once one point is selected */
  .frame.has-selection .pulse-point:not(.selected){
    opacity:.5;
  }

  /* selected point: warm color, locked static ring instead of pulsing, bigger dot, coord chip */
  .pulse-point.selected .dot{
    width:10px; height:10px;
    margin:-5px 0 0 -5px;
    background:var(--selected);
    box-shadow:0 0 10px rgba(255,181,69,.95);
  }
  .pulse-point.selected .ring{
    animation:none;
    width:26px; height:26px;
    border-color:var(--selected);
    opacity:.9;
  }
  .pulse-point.selected .ring.r2{
    width:38px; height:38px;
    opacity:.4;
  }
  .pulse-point.selected .chip{
    position:absolute;
    top:0; left:0;
    transform:translate(12px,-28px);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size:10.5px;
    color:#0e1318;
    background:var(--selected);
    padding:2px 6px;
    border-radius:5px;
    white-space:nowrap;
  }

  @media (prefers-reduced-motion: reduce){
    .pulse-point .ring{ animation: none; }
  }
</style>
</head>
<body>

  <div class="frame" id="frame">
    <!-- <img src="your-image.jpg" alt=""> -->
  </div>

  <script>
    /**
     * Add a pulse point at pixel (x, y) coordinates of the source image,
     * scaled automatically to however the .frame is actually rendered.
     *
     * @param {HTMLElement} container - the .frame element (position:relative wrapper)
     * @param {number} x - x in original image pixels
     * @param {number} y - y in original image pixels
     * @param {number} imgWidth - original image width in pixels
     * @param {number} imgHeight - original image height in pixels
     */
    function addPulsePoint(container, x, y, imgWidth, imgHeight) {
      const rect = container.getBoundingClientRect();
      const scaleX = rect.width / imgWidth;
      const scaleY = rect.height / imgHeight;

      const point = document.createElement('div');
      point.className = 'pulse-point';
      point.style.left = (x * scaleX) + 'px';
      point.style.top = (y * scaleY) + 'px';
      point.innerHTML = `
        <div class="dot"></div>
        <div class="ring"></div>
        <div class="ring r2"></div>
        <div class="chip">${x}, ${y}</div>
      `;

      point.addEventListener('click', () => selectPoint(container, point));

      container.appendChild(point);
      return point;
    }

    function selectPoint(container, point) {
      container.querySelectorAll('.pulse-point.selected')
        .forEach(p => p.classList.remove('selected'));
      point.classList.add('selected');
      container.classList.add('has-selection');
    }

    // demo: a few sample points on a 1280x960 source image
    const frame = document.getElementById('frame');
    const p1 = addPulsePoint(frame, 200, 150, 1280, 960);
    const p2 = addPulsePoint(frame, 900, 400, 1280, 960);
    const p3 = addPulsePoint(frame, 640, 700, 1280, 960);

    // click empty area to deselect
    frame.addEventListener('click', (e) => {
      if (e.target === frame) {
        frame.classList.remove('has-selection');
        frame.querySelectorAll('.pulse-point.selected')
          .forEach(p => p.classList.remove('selected'));
      }
    });
  </script>

</body>
</html>
